<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madison Eats</title>
<meta name="description" content="Every place to eat in Madison, WI on one map, with ratings from Google, DoorDash, Uber Eats, Toast, EatStreet and Grubhub, health inspections, and which delivery apps carry each one.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='black'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-weight='800' font-size='17' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<script>try { var th = localStorage.getItem('me:theme'); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=4864b5a34a">
</head>
<body>
<header class="top">
  <span class="wordmark">Madison Eats</span>
  <nav class="tabs" role="tablist">
    <button role="tab" class="tab active" data-view="grid" data-tab="grid">全部餐馆</button>
    <button role="tab" class="tab" data-view="map" data-tab="map">地图</button>
    <button role="tab" class="tab" data-view="plat" data-tab="plat">外卖平台</button>
  </nav>
  <div class="top-right">
    <button class="iconbtn" id="theme" type="button" aria-label="切换黑白" title="切换黑白">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
    </button>
    <button class="lang" id="lang" aria-label="Switch language">EN</button>
  </div>
</header>

<main id="view-grid" class="view active">
  <div class="gwrap" id="gwrap">
    <div class="ghead" id="ghead"></div>
    <div class="gcount" id="gcount"></div>
    <ol class="grid" id="grid"></ol>
    <button class="more-btn gmore" id="gmore" type="button" hidden></button>
    <footer class="gfoot" id="gfoot"></footer>
  </div>
  <article class="gpage" id="gpage" hidden></article>
</main>

<main id="view-map" class="view">
  <aside class="rail" id="rail">
    <div class="filters">
      <input id="q" class="search" type="search" autocomplete="off" data-i18n-ph="search_ph" placeholder="搜店名、菜系或菜名">
      <div class="frow">
        <div class="picker"><button class="pick-btn" id="f-cuis" type="button" aria-haspopup="true" aria-expanded="false"></button><div class="pick-pop" id="f-cuis-pop" hidden></div></div>
        <div class="picker"><button class="pick-btn" id="f-range" type="button" aria-haspopup="true" aria-expanded="false"></button>
          <div class="pick-pop rg-pop" id="f-range-pop" hidden>
            <div class="rg" data-rg></div>
            <div class="wide rg-origin"><span class="lbl" data-i18n="dist_from">距离从</span><select id="f-from" aria-label="Distance from"></select></div>
            <div class="pick-foot rg-foot"><button type="button" class="linkish" data-rg-clear data-i18n="pick_clear">清空</button><button type="button" class="pick-done" data-rg-done data-i18n="pick_done">完成</button></div>
          </div>
        </div>
        <select id="f-sort" aria-label="Sort"></select>
        <button class="chip" id="f-open" type="button" aria-pressed="false" data-i18n="open_now">营业中</button>
        <button class="chip" id="f-more" type="button" aria-expanded="false" data-i18n="more_filters">更多筛选</button>
        <button class="chip dice" id="f-dice" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/></svg>
          <span data-i18n="rnd_btn">随机一家</span>
        </button>
      </div>
      <div class="more-panel" id="more-panel" hidden>
        <select id="f-kind" aria-label="Type"></select>
        <select id="f-tag" aria-label="Occasion"></select>
        <select id="f-plat" aria-label="Delivery app"></select>
        <select id="f-rated" aria-label="Ratings"></select>
      </div>
    </div>
    <div class="count" id="count"></div>
    <ol class="list" id="list"></ol>
  </aside>
  <section class="mapwrap">
    <div id="map"></div>
    <article class="drawer" id="drawer" hidden></article>
  </section>
  <button class="switcher" id="switcher" type="button"></button>
</main>

<main id="view-plat" class="view">
  <div class="plat-page"><div class="plat-inner">
    <div class="plat-cards" id="plat-cards"></div>
    <div class="plat-price" id="plat-price"></div>
    <p class="plat-note" id="plat-note"></p>
    <div class="plat-tools">
      <input id="pq" class="search" type="search" autocomplete="off" data-i18n-ph="search_ph2" placeholder="搜店名">
      <div class="picker"><button class="pick-btn" id="p-cuis" type="button" aria-haspopup="true" aria-expanded="false"></button><div class="pick-pop" id="p-cuis-pop" hidden></div></div>
      <select id="p-sort" aria-label="Sort"></select>
    </div>
    <div id="plat-list"></div>
    <div class="xpanel" id="plat-extra"></div>
  </div></div>
</main>

<dialog class="rnd" id="rnd" aria-labelledby="rnd-title">
  <div class="rnd-in">
    <div class="rnd-top"><b id="rnd-title" data-i18n="rnd_title">今天吃这家？</b><button class="rnd-x" id="rnd-x" type="button" aria-label="Close">×</button></div>
    <div class="rnd-card" id="rnd-card">
      <div class="rnd-photo" id="rnd-photo"></div>
      <div class="rnd-name" id="rnd-name"></div>
      <div class="rnd-sub" id="rnd-sub"></div>
    </div>
    <div class="rnd-act">
      <button class="act primary" id="rnd-go" type="button" data-i18n="rnd_go">就它了</button>
      <button class="act" id="rnd-again" type="button" data-i18n="rnd_again">换一家</button>
    </div>
    <div class="rnd-range">
      <details class="rnd-rg" id="rnd-rg"><summary><span class="rg-sum"></span></summary><div class="rg" data-rg></div></details>
      <div class="rnd-foot"><span class="rg-from"></span><span id="rnd-from"></span></div>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/config.js?v=32ab0ec65c"></script>
<script src="guard-client.js?v=9af92d3c84"></script>
<script src="app.js?v=079bf7b630"></script>
<script src="feedback.js?v=f6ff8df4eb" data-site="eats" data-star="WEBGRS/madison-food-map" data-float-bottom-narrow="72" data-narrow-max="760" defer></script>
</body>
</html>
